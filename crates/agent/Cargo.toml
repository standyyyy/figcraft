[package]
name = "figcraft-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigCraft embedded Agent: Rig runtime, shadow session, and one-undo commits"

[lints]
workspace = true

[dependencies]
figcraft-agent-tools = { workspace = true }
figcraft-engine = { workspace = true }
figcraft-doc = { workspace = true }
figcraft-format = { workspace = true }
rig-agent = { workspace = true }
rig-core = { workspace = true }
# Driving Rig's streaming stream from a blocking worker thread. Already in the graph through
# Rig and ureq; declared here because the code polls it directly.
futures = { workspace = true }
futures-timer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# The model transport: blocking HTTP, the same client the font store already ships.
#
# Native only. The browser has no sockets and uses fetch instead, and ureq's rustls feature would
# pull ring and getrandom into the wasm build, which the wasm gate refuses (and which would be a
# second TLS stack there). The transport module is compiled out on wasm for the same reason.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true }
